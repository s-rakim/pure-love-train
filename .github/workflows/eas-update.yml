name: Over-the-air update (expo.dev)

# Sends the current JavaScript to phones already running a matching build, without a new APK.
# Only for app code changes: anything that touches native code (new native packages, app.json
# plugins, permissions, the app icon) needs a new APK from "Android release (expo.dev)".
on:
  workflow_dispatch:
    inputs:
      message:
        description: What changed, shown on expo.dev
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Link the expo.dev project
        run: eas init --non-interactive --force

      - name: Publish the update
        env:
          MESSAGE: ${{ inputs.message }}
        run: eas update --channel production --platform android --message "$MESSAGE" --non-interactive
