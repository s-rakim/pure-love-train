name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk pure-love.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: Pure Love ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          body: |
            Android build of Pure Love. Download `pure-love.apk` on an Android phone and open it to install
            (you may need to allow installs from your browser or file manager).
          files: pure-love.apk
