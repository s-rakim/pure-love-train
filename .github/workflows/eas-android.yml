name: Android release (expo.dev)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to create, like v1.0.0
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Make sure the release tag is new
        # Publishing onto an existing tag would attach this APK to someone else's code.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "::error::Tag $VERSION already exists. Pick a new version."
            exit 1
          fi

      - run: npm ci

      - name: Link the expo.dev project
        run: eas init --non-interactive --force

      - name: Build the APK on expo.dev
        run: eas build --platform android --profile preview --non-interactive --wait --json > build.json

      - name: Download the APK
        run: curl -fsSL -o pure-love.apk "$(jq -r '.[0].artifacts.buildUrl' build.json)"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: "You&I💞 ${{ inputs.version }}"
          body: |
            Android build of You&I💞, built on expo.dev. Download `pure-love.apk` on an Android phone and
            open it to install (you may need to allow installs from your browser or file manager).
          files: pure-love.apk
